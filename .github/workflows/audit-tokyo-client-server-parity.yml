name: Audit exact server JAR hashes for client parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-tokyo-client-server-parity.yml'

permissions:
  contents: read

jobs:
  parity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified server release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download tokyo-world-server-1.20.1-forge-47.4.28 --dir dist \
            --pattern 'TokyoWorld-Server-1.20.1-Forge-47.4.28.zip'
      - name: Read exact SHA1 and SHA256 from server files
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          file = Path('dist/TokyoWorld-Server-1.20.1-Forge-47.4.28.zip')
          targets = [
              'ae2wtlib-15.3.3-forge.jar',
              'mob_grinding_utils-1.20.1-1.1.0.jar',
              'sliceanddice-forge-3.6.0.jar',
              'AdvancedAE-1.3.6-1.20.1.jar',
              'create-1.20.1-6.0.8.jar',
              'appliedenergistics2-forge-15.4.12.jar',
          ]
          rows = {}
          with zipfile.ZipFile(file) as pack:
              assert pack.testzip() is None
              for name in targets:
                  data = pack.read('mods/' + name)
                  rows[name] = {
                      'sha1': hashlib.sha1(data).hexdigest(),
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'size': len(data),
                  }
          print('TOKYO_PARITY_JSON=' + json.dumps(rows, sort_keys=True), flush=True)
          Path('dist/tokyo-parity-audit.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-Verified-Server-Parity-Hashes
          path: dist/tokyo-parity-audit.json
          retention-days: 7
