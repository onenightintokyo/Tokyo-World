name: Build Tokyo World Standalone Launcher

on:
  pull_request:
    paths:
      - 'launcher-standalone/**'
      - 'modpacks/**'
      - 'config/**'
      - 'defaultconfigs/**'
      - 'kubejs/**'
      - 'tools/make_client_bootstrap.py'
      - 'tools/validate_tokyo_client_manifest.py'
      - 'tools/build_client_update_index.py'
      - 'tools/publish_public_update_feeds.py'
      - 'resourcepacks/**'
      - 'shaderpacks/**'
      - '.github/workflows/tokyo-launcher-standalone.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher-standalone/**'
      - 'modpacks/**'
      - 'config/**'
      - 'defaultconfigs/**'
      - 'kubejs/**'
      - 'tools/make_client_bootstrap.py'
      - 'tools/validate_tokyo_client_manifest.py'
      - 'tools/build_client_update_index.py'
      - 'tools/publish_public_update_feeds.py'
      - 'resourcepacks/**'
      - 'shaderpacks/**'
      - '.github/workflows/tokyo-launcher-standalone.yml'

permissions:
  contents: write

jobs:
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build custom TW icon for EXE and Minecraft
        shell: pwsh
        run: |
          ./launcher-standalone/Assets/PrepareIcons.ps1
          if (!(Test-Path launcher-standalone/Assets/TokyoWorldIcon.ico)) { throw "TW icon not generated" }
          if (!(Test-Path launcher-standalone/Assets/TokyoWorldIcon.png)) { throw "TW PNG not generated" }
      - name: Verify pinned client dependencies and excluded mods
        shell: pwsh
        run: python tools/validate_tokyo_client_manifest.py
      - name: Build safe token-free client snapshot inside launcher EXE
        shell: pwsh
        run: |
          python tools/make_client_bootstrap.py
          if (!(Test-Path launcher-standalone/Assets/TokyoWorldClientSnapshot.zip)) {
            throw "Missing embedded client snapshot"
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path launcher-standalone/Assets/TokyoWorldClientSnapshot.zip))
          try {
            if ($zip.Entries.Count -lt 30) { throw "Embedded snapshot unexpectedly small" }
            Write-Host "Client snapshot files: $($zip.Entries.Count)"
          } finally { $zip.Dispose() }
      - name: Verify public update publisher Python syntax
        run: python -m py_compile tools/build_client_update_index.py tools/publish_public_update_feeds.py
      - name: Restore Windows desktop project
        run: dotnet restore launcher-standalone/TokyoWorldLauncher.csproj -r win-x64
      - name: Publish single-file, self-contained EXE
        shell: pwsh
        run: >
          dotnet publish launcher-standalone/TokyoWorldLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -o dist
      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/TokyoWorldLauncher.exe)) { throw "No TokyoWorldLauncher.exe produced" }
          Get-Item dist/TokyoWorldLauncher.exe | Select-Object Name,Length
          Get-FileHash dist/TokyoWorldLauncher.exe -Algorithm SHA256
      - name: Test Concept 4 single-file artwork and screenshot
        shell: pwsh
        run: ./launcher-standalone/Assets/Test-Concept4UI.ps1
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-CrimsonUI-Preview
          path: dist/CrimsonTokyoUI-Preview.png
          if-no-files-found: error
          retention-days: 10
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-Standalone-Windows-x64
          path: dist/TokyoWorldLauncher.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct-download TokyoWorldLauncher.exe release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [xml](Get-Content launcher-standalone/TokyoWorldLauncher.csproj -Raw)
          $tag = 'tokyo-world-launcher-v' + $version.Project.PropertyGroup.Version
          $exe = 'dist/TokyoWorldLauncher.exe'
          if (!(Test-Path $exe)) { throw 'Launcher EXE does not exist' }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Tokyo World Launcher v$($version.Project.PropertyGroup.Version)" --notes "Windows x64 self-contained launcher. Verified GitHub Actions build."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create launcher release' }
          }
          gh release upload $tag $exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload launcher EXE' }
          gh release edit $tag --notes "Windows x64 self-contained launcher. Source revision: $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Could not update launcher release metadata' }

      # The public update feed is NOT in a watched workflow path: committing
      # these static JSON files cannot cause another launcher build.
      - name: Build immutable public client update index
        if: github.ref == 'refs/heads/main'
        run: python tools/build_client_update_index.py
      - name: Publish public token-free launcher and game update feeds
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_public_update_feeds.py

