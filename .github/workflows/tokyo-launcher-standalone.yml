name: Build Tokyo World Standalone Launcher

on:
  pull_request:
    paths:
      - 'launcher-standalone/**'
      - '.github/workflows/tokyo-launcher-standalone.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher-standalone/**'
      - '.github/workflows/tokyo-launcher-standalone.yml'

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build custom TW icon for EXE and Minecraft
        shell: pwsh
        run: |
          ./launcher-standalone/Assets/PrepareIcons.ps1
          if (!(Test-Path launcher-standalone/Assets/TokyoWorldIcon.ico)) { throw "TW icon not generated" }
          if (!(Test-Path launcher-standalone/Assets/TokyoWorldIcon.png)) { throw "TW PNG not generated" }
      - name: Build safe token-free client snapshot inside launcher EXE
        shell: pwsh
        run: |
          python tools/make_client_bootstrap.py
          if (!(Test-Path launcher-standalone/Assets/TokyoWorldClientSnapshot.zip)) {
            throw "Missing embedded client snapshot"
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path launcher-standalone/Assets/TokyoWorldClientSnapshot.zip))
          try {
            if ($zip.Entries.Count -lt 30) { throw "Embedded snapshot unexpectedly small" }
            Write-Host "Client snapshot files: $($zip.Entries.Count)"
          } finally { $zip.Dispose() }
      - name: Restore Windows desktop project
        run: dotnet restore launcher-standalone/TokyoWorldLauncher.csproj -r win-x64
      - name: Publish single-file, self-contained EXE
        shell: pwsh
        run: >
          dotnet publish launcher-standalone/TokyoWorldLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -o dist
      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/TokyoWorldLauncher.exe)) { throw "No TokyoWorldLauncher.exe produced" }
          Get-Item dist/TokyoWorldLauncher.exe | Select-Object Name,Length
          Get-FileHash dist/TokyoWorldLauncher.exe -Algorithm SHA256
      - name: Test Concept 4 single-file artwork and screenshot
        shell: pwsh
        run: ./launcher-standalone/Assets/Test-Concept4UI.ps1
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-CrimsonUI-Preview
          path: dist/CrimsonTokyoUI-Preview.png
          if-no-files-found: error
          retention-days: 10
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-Standalone-Windows-x64
          path: dist/TokyoWorldLauncher.exe
          if-no-files-found: error
          retention-days: 30
