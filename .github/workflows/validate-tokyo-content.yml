name: Validate Tokyo World Modpack and Quest Trees

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'defaultconfigs/**'
      - 'modpacks/tokyo_modules.json'
      - 'tools/validate_wave06.py'
      - 'tools/verify_wave06_modrinth.py'
      - 'tools/check_wave06_jar_items.py'
      - 'tools/validate_expert_final.py'
      - 'kubejs/**'
      - '.github/workflows/validate-tokyo-content.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'defaultconfigs/**'
      - 'modpacks/tokyo_modules.json'
      - 'tools/validate_wave06.py'
      - 'tools/verify_wave06_modrinth.py'
      - 'tools/check_wave06_jar_items.py'
      - 'tools/validate_expert_final.py'
      - 'kubejs/**'
      - '.github/workflows/validate-tokyo-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wave 06 manifest, SNBT structure, IDs and quest dependencies
        run: python3 tools/validate_wave06.py
      - name: Syntax-check every KubeJS server script
        run: |
          for f in kubejs/server_scripts/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check the complete Expert Final configuration and recipe uniqueness
        run: python3 tools/validate_expert_final.py
      - name: Confirm Modrinth Forge 1.20.1 builds and required dependencies
        run: python3 tools/verify_wave06_modrinth.py
      - name: Inspect actual pinned Forge JARs for new quest items
        run: python3 tools/check_wave06_jar_items.py
