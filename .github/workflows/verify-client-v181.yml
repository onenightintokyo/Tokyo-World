name: Verify Tokyo World client token-free repair v1.8.1

on:
  push:
    branches:
      - fix/no-token-client-ftbquests-remove-everycompat-v181
    paths:
      - 'launcher-standalone/**'
      - 'modpacks/**'
      - 'tools/validate_client_v181.py'
      - 'tools/verify_curseforge_core.py'
      - '.github/workflows/verify-client-v181.yml'
  pull_request:
    paths:
      - 'launcher-standalone/**'
      - 'modpacks/**'
      - 'tools/validate_client_v181.py'
      - 'tools/verify_curseforge_core.py'
      - '.github/workflows/verify-client-v181.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate client public source, exact missing-mod fix and Every Compat removal
        run: python3 tools/validate_client_v181.py
      - name: Check all four original Forge 1.20.1 FTB files by publisher SHA1
        run: python3 tools/verify_curseforge_core.py
