name: Build Tokyo World complete server pack

on:
  push:
    branches:
      - main
      - feature/tokyo-world-server-pack-1201-40p
    paths:
      - 'serverpack/**'
      - 'modpacks/tokyo_modules.json'
      - 'modpacks/base_mod_hashes.txt'
      - '.github/workflows/build-tokyo-server-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Forge 47.4.28 dedicated server ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source configuration and mod manifests
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate server pack builder Python syntax
        run: python -m py_compile serverpack/build_server_pack.py
      - name: Resolve every mod, verify original hashes and build server ZIP
        run: python serverpack/build_server_pack.py
      - name: Verify complete server ZIP, JAR checksums and version parity
        run: python serverpack/verify_server_pack.py
      - name: Upload FULL verified server ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-Server-1.20.1-Forge-47.4.28
          path: dist/TokyoWorld-Server-1.20.1-Forge-47.4.28.zip
          retention-days: 30
          if-no-files-found: error
      - name: Publish directly downloadable server ZIP release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tokyo-world-server-1.20.1-forge-47.4.28"
          zip="dist/TokyoWorld-Server-1.20.1-Forge-47.4.28.zip"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Tokyo World Dedicated Server • Minecraft 1.20.1 / Forge 47.4.28" \
              --notes "Verified server-only ZIP (mods/config/defaultconfigs/kubejs, no start scripts)."
          fi
          gh release upload "$tag" "$zip" --clobber
          gh release edit "$tag" --notes "Verified server-only ZIP (mods/config/defaultconfigs/kubejs, no start scripts). Source commit: $GITHUB_SHA"
          gh release view "$tag" --json assets --jq '.assets[] | [.name, .size, .downloadCount] | @tsv'
      - name: Upload missing-mod report if builder cannot make a complete ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TokyoWorld-Server-Integrity-Report
          path: serverpack/reports/*
          retention-days: 30
          if-no-files-found: warn
